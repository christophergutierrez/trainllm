# trainLLM configuration — edit this file to configure a fine-tuning run.
# All scripts read from here; env vars (TRAIN_DATA, MAX_STEPS, etc.) still override for one-offs.

model: Qwen/Qwen2.5-Coder-14B-Instruct
adapter_name: my-adapter   # LoRA module name in vLLM; drives lora/ subdirectory name
chat_template: qwen-2.5    # Unsloth template: qwen-2.5, llama-3.1, gemma-it, chatml, …

paths:
  base_dir: ~/trainLLM
  hf_home: ~/trainLLM/models/hf
  unsloth_python: ~/.unsloth/studio/unsloth_studio/bin/python3

data:
  train: ~/trainLLM/data/training.jsonl
  holdout: ~/trainLLM/data/holdout.jsonl

training:
  max_seq_length: 2048
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0
  lora_init: gaussian        # LoRA initialization: "gaussian", true (Kaiming), "loftq", "corda"; Unsloth blocks "pissa"/"olora"
  use_rslora: true          # rank-stabilized scaling — enables stable training at higher ranks
  batch_size: 2
  gradient_accumulation_steps: 4
  warmup_steps: 50
  max_steps: 2000
  learning_rate: 2.0e-4
  weight_decay: 0.01
  lr_scheduler: cosine
  neftune_noise_alpha: 5    # noisy embeddings during training (0 to disable); improves instruction-following
  train_on_responses_only: true  # only compute loss on assistant tokens, not prompts
  load_in_4bit: false       # QLoRA quantization (4-bit; mutually exclusive with fp8)
  load_in_fp8: false        # FP8 quantization (~32% faster on Blackwell; mutually exclusive with 4bit)
  optimizer: adamw_torch    # "adamw_torch" (default) or "adamw_8bit" (lower VRAM, requires bitsandbytes)
  save_steps: 500
  save_total_limit: null   # null = keep all checkpoints (required for best-checkpoint selection in cycle.py)

scoring:
  mode: json              # "json" (structured key comparison) or "text" (pure text similarity)
  primary_key: endpoint   # top-level JSON key scored as exact match (e.g. "endpoint", "function", "tool")
  detail_key: params      # nested dict key scored by key-presence + value match (e.g. "params", "args", "arguments")
  multi_step_key: steps   # key wrapping multi-step sequences (e.g. "steps", "calls", "actions")
  primary_weight: 0.4     # weight of primary key match within structural score
  detail_weight: 0.6      # weight of detail key match within structural score
  composite_weights:      # how similarity and structural combine (must sum to 1.0)
    similarity: 0.3
    structural: 0.7
  composite_weights_judge:  # weights when LLM judge is enabled (must sum to 1.0)
    similarity: 0.2
    structural: 0.5
    judge: 0.3

vllm:
  port: 8000
  gpu_memory_utilization: 0.85

timeouts:
  train_silence: 1800    # seconds of no output before killing training (GPU deadlock guard); 1800 accommodates first-time HF model download
  vllm_startup: 900      # seconds to wait for vLLM /v1/models to become ready
  vllm_poll_interval: 30
  eval_timeout: 3600     # wall timeout for eval run
