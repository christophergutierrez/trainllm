# Lean 4 tactic - 14B target model smoke run (Phase 2.2)
# Verifies training starts and produces a PEFT adapter before the full run.
model: Qwen/Qwen2.5-Coder-14B-Instruct
adapter_name: lean-14b-smoke
chat_template: qwen-2.5

paths:
  base_dir: ~/git_home/trainllm
  hf_home: ~/git_home/trainllm/models/hf
  unsloth_python: ~/.unsloth/studio/unsloth_studio/bin/python3

data:
  train: ~/git_home/trainllm/data/lean_stat_clean/train.jsonl
  holdout: ~/git_home/trainllm/data/lean_stat_clean/valid.jsonl

training:
  max_seq_length: 2048
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0
  lora_init: gaussian
  use_rslora: true
  batch_size: 1
  gradient_accumulation_steps: 8
  warmup_steps: 5
  max_steps: 50
  learning_rate: 2.0e-4
  weight_decay: 0.01
  lr_scheduler: cosine
  neftune_noise_alpha: 0
  train_on_responses_only: true
  load_in_4bit: false
  load_in_fp8: false
  optimizer: adamw_8bit
  save_steps: 50
  save_total_limit: 1
  eval_during_training: false

timeouts:
  train_silence: 1800
  vllm_startup: 900
  vllm_poll_interval: 30
  eval_timeout: 3600
